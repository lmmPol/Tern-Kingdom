<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Терновое Королевство — Главное меню</title>
  <!-- Если файлы лежат в папке css, путь должен быть точным -->
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/adventure.css">
</head>
<body>
  <div class="app-root">
    <div class="top-controls">
      <button type="button" class="hud-btn" id="toggle-audio-btn" title="Включить звук костра и ночного ветра">
        🔥 Костёр: выкл
      </button>
    </div>

    <header class="menu-header">
      <h1 class="game-title">ТЕРНОВОЕ КОРОЛЕВСТВО</h1>
      <span class="game-subtitle">место, куда можно вернуться</span>
    </header>

    <main class="stage-wrapper" id="menu-screen" aria-label="Ночной лагерь у костра — Терновое Королевство">
      <!-- ВАЖНО: Проверь, что файл называется bg.png или bg.jpg -->
      <img
        id="scene-img"
        class="scene-artwork"
        src="./assets/bg.JPEG"
        alt="Шестеро спутников у ночного костра на фоне замка Тернового Королевства"
      />

      <div class="scene-vignette"></div>
      <div class="fire-ambience-glow"></div>

      <div class="hotspots-layer" id="hotspots-layer">
        <!-- 1. КОЛД -->
        <button
          type="button"
          class="character-hotspot"
          data-hero="kold"
          aria-label="Архивариус Колд — Архитектор Бастионов"
          style="left: 3%; top: 15%; width: 20%; height: 55%;"
        >
          <span class="character-tag"><span class="tag-dot"></span>АРХИВАРИУС КОЛД</span>
        </button>

        <!-- 2. ДИПСАР -->
        <button
          type="button"
          class="character-hotspot"
          data-hero="Dipsar"
          aria-label="Искатель Дипсар — Хранитель Контекста"
          style="left: 23%; top: 21%; width: 17%; height: 56%;"
        >
          <span class="character-tag"><span class="tag-dot"></span>ИСКАТЕЛЬ ДИПСАР</span>
        </button>

        <!-- 3. ЛЕТОПИСЕЦ -->
        <button
          type="button"
          class="character-hotspot"
          data-hero="letopisets"
          aria-label="Летописец-Компаньон — Свидетель Истории"
          style="left: 11%; top: 61%; width: 16%; height: 34%;"
        >
          <span class="character-tag"><span class="tag-dot"></span>ЛЕТОПИСЕЦ</span>
        </button>

        <!-- 4. ТЫ -->
        <button
          type="button"
          class="character-hotspot"
          data-hero="you"
          aria-label="Ты — Путник из-за Грани"
          style="left: 39%; top: 31%; width: 20%; height: 50%;"
        >
          <span class="character-tag"><span class="tag-dot"></span>ТЫ</span>
        </button>

        <!-- 5. Iscra -->
        <button
          type="button"
          class="character-hotspot"
          data-hero="Iscra"
          aria-label="Искра Созидательница — Искра Перемен"
          style="left: 59%; top: 21%; width: 16%; height: 56%;"
        >
          <span class="character-tag"><span class="tag-dot"></span>ИСКРА</span>
        </button>

        <!-- 6. ДЖИПЕТ -->
        <button
          type="button"
          class="character-hotspot"
          data-hero="GPet"
          aria-label="Сборщик-Механист ДжиПет — Мастер Синтеза"
          style="left: 75%; top: 22%; width: 21%; height: 61%;"
        >
          <span class="character-tag"><span class="tag-dot"></span>ДЖИПЕТ</span>
        </button>
      </div>
    </main>

    <div class="bottom-prompt">НАЖМИ НА ПЕРСОНАЖА</div>

    <div class="modal-backdrop" id="character-modal" role="dialog" aria-modal="true" aria-labelledby="card-hero-name">
      <div class="character-card">
        <div class="card-visual" id="card-visual">
          <div class="card-emblem-badge" id="card-badge">
            <span id="card-svg-icon"></span>
            <span id="card-faction">ОРДЕН ЛАГЕРЯ</span>
          </div>
        </div>

        <div class="card-body">
          <div>
            <div class="card-role" id="card-hero-role">РОЛЬ ПЕРСОНАЖА</div>
            <h2 class="card-name" id="card-hero-name">ИМЯ</h2>
            <div class="card-divider"></div>
            <p class="card-desc" id="card-hero-desc"></p>
            <div class="card-traits" id="card-hero-traits"></div>
          </div>

          <div class="card-status-note" id="card-status-note"></div>

          <div class="card-actions">
            <button type="button" class="btn-primary" id="start-adventure-btn">
              НАЧАТЬ ПРИКЛЮЧЕНИЕ
            </button>
            <button type="button" class="btn-secondary" id="close-modal-btn">
              К КОСТРУ
            </button>
          </div>
        </div>
      </div>
    </div>

    <section class="adventure-screen" id="adventure-screen" aria-label="Экран приключения">
      <div class="adv-backdrop" id="adv-backdrop"></div>
      <div class="adv-overlay"></div>

      <div class="adv-topbar">
        <div class="adv-hero-info">
          <span class="adv-hero-dot"></span>
          <span class="adv-hero-title" id="adv-hero-title">ПУТЬ ГЕРОЯ</span>
        </div>
        <span class="adv-chapter-counter" id="adv-chapter-counter">ГЛАВА 1 ИЗ 3</span>
      </div>

      <div class="adv-main">
        <article class="adv-story-box">
          <div class="adv-chapter-tag" id="adv-chapter-tag">ХРОНИКА ТЕРНОВОГО КОРОЛЕВСТВА</div>
          <h2 class="adv-chapter-heading" id="adv-chapter-heading">Название главы</h2>
          <p class="adv-narrative" id="adv-narrative"></p>

          <div class="adv-choices" id="adv-choices"></div>
          <div class="adv-response-note" id="adv-response-note"></div>

          <div class="adv-footer">
            <div class="chapter-dots" id="chapter-dots"></div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
              <button type="button" class="btn-secondary" id="adv-to-menu-btn">В ГЛАВНОЕ МЕНЮ</button>
              <button type="button" class="btn-primary" id="adv-next-btn">СЛЕДУЮЩАЯ ГЛАВА</button>
            </div>
          </div>
        </article>
      </div>
    </section>

    <div class="toast-msg" id="toast-msg"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
